alerts:
  - name: latency_slo_burn
    severity: critical
    condition: 'p95(latency_ms) on event=="response_sent" > 3000'
    duration: 5m
    type: symptom-based
    channel: slack
    slack_channel: "#day13-llmops-alerts"
    owner: TaDuyLam-2A202602699
    runbook: docs/alerts.md#alert-1
  - name: elevated_error_rate
    severity: critical
    condition: 'error_rate_pct (request_failed / request_received) > 2'
    duration: 5m
    type: symptom-based
    channel: slack
    slack_channel: "#day13-llmops-alerts"
    owner: TaDuyLam-2A202602699
    runbook: docs/alerts.md#alert-2
  - name: retrieval_success_degraded
    severity: warning
    condition: 'retrieval_success_rate_pct (tool_success==true / tool_success!=null) < 90'
    duration: 10m
    type: symptom-based
    channel: slack
    slack_channel: "#day13-llmops-alerts"
    owner: TaDuyLam-2A202602699
    runbook: docs/alerts.md#alert-3
